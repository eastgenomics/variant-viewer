services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: variants
      POSTGRES_USER: variants_admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variants_admin -d variants"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
