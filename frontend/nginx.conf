server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: serve index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api to FastAPI backend (adjust upstream host as needed)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
