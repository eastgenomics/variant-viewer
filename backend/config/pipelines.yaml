pipelines:
  dragen_germline:
    label: "DRAGEN Germline v3"
    # TODO: Differentiate from dragen_somatic once real DRAGEN VCF header strings are confirmed.
    # Both pipelines currently share the "DRAGEN" pattern; dragen_germline wins by dict insertion order.
    # Validate against actual ##source / ##pipeline lines from lab VCFs and update patterns.
    header_pattern: "DRAGEN"
    default_filters:
      gnomad_af_max: 0.01
      consequences:
        - missense_variant
        - frameshift_variant
        - stop_gained
        - stop_lost
        - start_lost
        - splice_donor_variant
        - splice_acceptor_variant
        - splice_region_variant
      clinvar_exclude:
        - Benign
        - Likely_benign

  dragen_somatic:
    label: "DRAGEN Somatic"
    header_pattern: "DRAGEN"
    default_filters:
      gnomad_af_max: 0.001
